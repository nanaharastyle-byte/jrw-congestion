name: collect
on:
  schedule:
    - cron: "*/5 * * * *"   # 5分ごとに記録（GitHub側の混雑で遅れることがあります）
  workflow_dispatch:         # 手動実行ボタン
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.c.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q jpholiday
      - id: c
        run: python congestion.py collect
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 30秒ごとの記録を取り出す
        if: steps.c.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/db
          (git fetch -q --depth=1 origin live && git archive FETCH_HEAD raw | tar -x -C /tmp/db) || echo "30秒ごとの記録はまだありません"
      - name: report (1時間に1回)
        if: steps.c.outputs.publish == 'true'
        run: python congestion.py report
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git rm -r -q --ignore-unmatch docs          # 古い docs フォルダは削除として保存
          git commit -q -m "collect $(TZ=Asia/Tokyo date +%F_%H%M)" || exit 0
          git stash -q || true                        # 保存対象外の変更は取り込みの邪魔にならないよう退避
          for i in 1 2 3; do                          # 途中で他の変更が入っても、取り込んでから再挑戦
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
      - if: steps.c.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: collect
    if: needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
