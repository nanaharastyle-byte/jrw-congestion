<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天気×遅延</title>
<style>
:root{--bg:#eef2f6;--paper:#fff;--ink:#1a2230;--sub:#5b6577;--rule:#d5dce6;--acc:#0072bc;
 --l1:#6fb3e8;--l2:#58a7a4;--l3:#1f9a86;--l4:#9cc54a;--l5:#c9982c;--l6:#b8407e;--l7:#3d3fa0;--rain:#2f7fd1;--wind:#1f9a86;--delay:#c23b22}
@media (prefers-color-scheme:dark){:root{--bg:#141a22;--paper:#1d2530;--ink:#e8edf3;--sub:#9aa6b8;--rule:#2e3947}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
nav{display:flex;background:var(--acc)}
nav a{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:8px 0;opacity:.75}
nav a[aria-current=page]{opacity:1;box-shadow:inset 0 -3px 0 #fff}
header{background:var(--paper);border-bottom:1px solid var(--rule);padding:12px}
h1{font-size:18px;margin:0}
.meta{color:var(--sub);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
select{width:100%;font-size:14px;padding:6px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.seg{display:flex;margin-top:10px;border:1px solid var(--acc);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--acc);font-size:13px;font-weight:700;padding:7px 0}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f5b400;outline-offset:1px}
main{padding:10px;max-width:760px;margin:0 auto}
h2{font-size:15px;margin:16px 0 6px}
.item{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;margin-bottom:6px;display:grid;grid-template-columns:1.8em 1fr auto;gap:8px;align-items:center}
.rank{font-weight:700;color:var(--sub);text-align:right}
.ttl{font-weight:700}
.sub{color:var(--sub);font-size:12px}
.when{font-size:13px;font-weight:700;color:var(--acc)}
.num{text-align:right;font-weight:700;font-size:18px;white-space:nowrap}
.num small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.bar{height:5px;border-radius:3px;background:var(--rule);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.note{font-size:12px;color:var(--sub);margin:8px 0}
.warn{background:#fff4d6;color:#6b4c00;border-radius:6px;padding:8px;font-size:13px;margin:8px 0}
.empty{color:var(--sub);padding:24px 0;text-align:center}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px;margin-bottom:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;width:100%}
th{color:var(--sub);font-weight:400;padding:4px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--rule)}
td{padding:4px;border-bottom:1px solid var(--rule);white-space:nowrap}
.chip{display:inline-block;font-size:11px;border-radius:10px;padding:0 7px;margin:3px 4px 0 0;background:var(--bg);color:var(--sub)}

.rate{display:flex;align-items:center;gap:6px}.rate i{display:inline-block;height:8px;border-radius:4px;min-width:2px}
.lead{font-size:14px;margin:4px 0 8px}.lead b{color:var(--acc)}
svg text{font-size:10px;fill:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-top:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px}
</style></head><body>
<nav><a href="index.html">統計</a><a href="weather.html" aria-current="page">天気</a><a href="predict.html">予測</a><a href="monitor.html">在線</a><a href="timetable.html">時刻表</a><a href="patrol.html">巡回</a></nav>
<header>
 <h1>天気×遅延・混雑</h1><div class="meta" id="meta">読み込み中…</div>
 <div class="grid">
  <select id="period" aria-label="集計期間"></select>
  <select id="line" aria-label="路線"></select>
  <select id="lv" aria-label="混雑レベル"><option value="6">混雑＝大変多く以上</option><option value="7">混雑＝とても混雑</option><option value="5">混雑＝多く以上</option></select>
  <select id="day" aria-label="タイムラインの日付"></select>
  <select id="tg" aria-label="種別"><option value="0" selected>混雑＝特急を除く</option><option value="">混雑＝特急を含む</option><option value="1">混雑＝特急のみ</option></select>
 </div>
</header>
<main>
 <div id="out"><div class="empty">読み込み中…</div></div>
 <p class="note">遅延発生率＝5分ごとの記録のうち、その路線で5分以上遅れている列車が1本以上あった割合。雨量・風速は路線沿いのアメダス地点（気象庁）の最大値。混雑率＝号車ごとの記録のうち選んだレベル以上だった割合。</p>
</main>
<script>
let T=[40,60,80,100,130,160];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let IDX,D,TL;
function plabel(id){const[y,n]=id.slice(1).split('-').map(Number);if(id[0]==='M')return `月間 ${y}年${n}月`;
 const j=new Date(Date.UTC(y,0,4)),mon=new Date(j-((j.getUTCDay()+6)%7)*864e5+(n-1)*7*864e5),sun=new Date(+mon+6*864e5);
 const f=d=>`${d.getUTCMonth()+1}/${d.getUTCDate()}`;return `週間 ${f(mon)}〜${f(sun)}`}
async function init(){
 try{IDX=await (await fetch('stats/index.json',{cache:'no-store'})).json();TL=await (await fetch('stats/timeline.json',{cache:'no-store'})).json()}
 catch(e){$('out').innerHTML='<div class="empty">データがまだありません</div>';return}
 const st=IDX.status||{},wp=st.weatherPoints||{};
 $('meta').textContent=`更新 ${IDX.built}／観測地点 `+Object.entries(wp).map(([k,v])=>`${k}:${v.join('・')||'なし'}`).join('　');
 $('line').innerHTML=Object.entries(IDX.lines).map(([k,v])=>`<option value="${k}"${k==='kyoto'?' selected':''}>${v}</option>`).join('');
 $('period').innerHTML=[...IDX.periods.filter(p=>p[0]==='W'),...IDX.periods.filter(p=>p[0]==='M')].map(p=>`<option value="${p}">${plabel(p)}</option>`).join('');
 $('day').innerHTML=[...TL.days].reverse().map(d=>`<option value="${d}">${d.slice(5).replace('-','/')} のタイムライン</option>`).join('');
 await loadPeriod();
}
async function loadPeriod(){D=await (await fetch('stats/'+$('period').value+'.json',{cache:'no-store'})).json();render()}
// 観測数・混雑数を種別の選択に合わせて取り出す（base=全体の位置, xb=特急分の位置, i=0観測 1多く 2大変多く 3とても）
function pick(b,base,xb,i){const t=$('tg').value,a=b[base+i]||0,x=b[xb+i]||0;return t===''?a:t==='1'?x:a-x}
function labels(edges,unit){return [`${edges[0]}${unit}未満`,...edges.slice(0,-1).map((e,i)=>`${e}〜${edges[i+1]}`),`${edges.at(-1)}${unit}以上`]}
function barCell(r,col){return r==null?'<td style="color:var(--sub)">-</td>':`<td><span class="rate"><i style="width:${Math.max(2,r*60)}px;background:${col}"></i>${Math.round(r*100)}%</span></td>`}
function finding(bins,edges,unit,what,get){
 const rates=bins.map(get),b0=rates.findIndex(r=>r!=null),base=rates[b0];if(b0<0)return `<p class="lead">まだ比べられるだけのデータがありません。</p>`;
 for(let i=b0+1;i<rates.length;i++){if(rates[i]==null)continue;
  if(rates[i]>=Math.max(base*2,base+.15))return `<p class="lead"><b>${edges[i-1]}${unit}以上</b>で${what}が <b>${Math.round(base*100)}% → ${Math.round(rates[i]*100)}%</b> に上がっています。</p>`}
 return `<p class="lead">今のところ、${what}のはっきりした増加は見られません（データ蓄積中）。</p>`}
function table(kind,edges,unit,title){
 const c=D.cond?.[$('line').value];if(!c)return '';const bins=c[kind],L=+$('lv').value;
 const lab=labels(edges,unit);
 const dRate=b=>b[0]>=6?b[1]/b[0]:null,cRate=b=>{const o=pick(b,3,7,0);return o>=20?pick(b,3,7,L-4)/o:null};
 let t=`<h2>${title}</h2><div class="card">`+finding(bins,edges,unit,'遅延発生率',dRate)+finding(bins,edges,unit,'混雑率',cRate)+
  (()=>{const ci=kind==='rain'?12:13,cr=b=>b[0]>=6?(b[ci]||0)/b[0]:null;return finding(bins,edges,unit,`${kind==='rain'?'雨':'風'}が原因と発表された遅延`,cr)})()+
  `<div class="scroll"><table><tr><th>${kind==='rain'?'1時間雨量(mm)':'風速(m/s)'}</th><th>記録</th><th>遅延発生率</th><th>${kind==='rain'?'雨':'風'}が原因<br>（JR発表）</th><th>平均最大遅延</th><th>混雑率</th></tr>`;
 bins.forEach((b,i)=>{if(!b[0]&&!pick(b,3,7,0))return;
  t+=`<tr><td>${lab[i]}</td><td>${b[0]}回</td>${barCell(dRate(b),'var(--delay)')}${barCell(b[0]>=6?(b[kind==='rain'?12:13]||0)/b[0]:null,'var(--rain)')}<td>${b[0]?(b[2]/b[0]).toFixed(1)+'分':'-'}</td>${barCell(cRate(b),'var(--l6)')}</tr>`});
 return t+'</table></div></div>';
}
function delayTable(){
 const c=D.cond?.[$('line').value];if(!c)return '';const L=+$('lv').value;
 const r=c.delay.map(b=>{const o=pick(b,0,4,0);return o>=20?pick(b,0,4,L-4)/o:null});
 return `<h2>遅れている列車は混むか</h2><div class="card">`+
  (r[0]!=null&&r[1]!=null?`<p class="lead">5分以上遅れている列車の混雑率は <b>${Math.round(r[1]*100)}%</b>（平常時 ${Math.round(r[0]*100)}%）。</p>`:'<p class="lead">まだ比べられるだけのデータがありません。</p>')+
  `<table><tr><th>列車の状態</th><th>号車の記録</th><th>混雑率</th></tr><tr><td>平常（遅れ5分未満）</td><td>${pick(c.delay[0],0,4,0)}</td>${barCell(r[0],'var(--l6)')}</tr>`+
  `<tr><td>5分以上遅れ</td><td>${pick(c.delay[1],0,4,0)}</td>${barCell(r[1],'var(--l6)')}</tr></table></div>`;
}
function panel(y,h,label,vals,max,col,type,fmt){
 const W=440,x0=36,sx=W/48;let s=`<text x="0" y="${y+10}">${label}</text><text x="0" y="${y+23}">〜${fmt(max)}</text><text x="0" y="${y+h}">0</text>`+
  `<line x1="${x0}" x2="${x0+W}" y1="${y+h}" y2="${y+h}" stroke="var(--rule)"/>`;
 if(type==='bar'){for(const[slot,v]of vals)if(v>0)s+=`<rect x="${x0+slot*sx+.5}" y="${y+h-Math.min(1,v/max)*h}" width="${sx-1}" height="${Math.min(1,v/max)*h}" fill="${col}"/>`}
 else{let d='',prev=-2;for(const[slot,v]of vals){if(v==null){prev=-2;continue}const px=x0+slot*sx+sx/2,py=y+h-Math.min(1,v/max)*h;d+=(slot===prev+1?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);prev=slot}
  s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/>`}
 return s}
function timelineHtml(){
 const line=$('line').value,day=$('day').value,rows=TL.series?.[line]?.[day]||[],L=+$('lv').value;
 const cr=r=>{const o=pick(r,5,9,0);return o>=8?pick(r,5,9,L-4)/o*100:null};
 if(!rows.length)return '<h2>横並びタイムライン</h2><div class="empty">この日のデータがありません</div>';
 const get=i=>rows.map(r=>[r[0],r[i]]),cong=rows.map(r=>[r[0],cr(r)]);
 const mx=(i,m)=>Math.max(m,...rows.map(r=>r[i]||0));
 let s=`<svg viewBox="0 0 480 300" width="100%" role="img" aria-label="${day}の雨量・風速・遅延・混雑">`;
 s+=panel(5,50,'雨mm/h',get(1),mx(1,5),'var(--rain)','bar',v=>v.toFixed(0));
 s+=panel(75,50,'風m/s',get(2),mx(2,10),'var(--wind)','line',v=>v.toFixed(0));
 s+=panel(145,50,'遅延分',get(3),mx(3,10),'var(--delay)','bar',v=>v.toFixed(0));
 s+=panel(215,50,'混雑%',cong,100,'var(--l6)','line',v=>v.toFixed(0));
 for(let h=0;h<=24;h+=3)s+=`<text x="${36+h*440/24-6}" y="292">${h}時</text><line x1="${36+h*440/24}" x2="${36+h*440/24}" y1="5" y2="266" stroke="var(--rule)" stroke-dasharray="2 3"/>`;
 s+='</svg>';
 const wet=rows.filter(r=>(r[1]||0)>=1||r[3]>=5).map(r=>`<tr><td>${Math.floor(r[0]/2)}:${r[0]%2?'30':'00'}</td><td>${r[1]??'-'}</td><td>${r[2]??'-'}</td><td>${r[3]}分</td><td>${cr(r)!=null?Math.round(cr(r))+'%':'-'}</td></tr>`).join('');
 return `<h2>横並びタイムライン（${day.slice(5).replace('-','/')}・30分ごと）</h2><div class="card">${s}
  <div class="legend"><span><span class="sw" style="background:var(--rain)"></span>1時間雨量</span><span><span class="sw" style="background:var(--wind)"></span>風速</span><span><span class="sw" style="background:var(--delay)"></span>最大遅延</span><span><span class="sw" style="background:var(--l6)"></span>混雑率</span></div>
  ${wet?`<details><summary class="sub">雨1mm以上・遅延5分以上の時間帯の数値</summary><div class="scroll"><table><tr><th>時刻</th><th>雨mm/h</th><th>風m/s</th><th>最大遅延</th><th>混雑率</th></tr>${wet}</table></div></details>`:''}</div>`;
}
// 路線ごとに「雨が原因の遅延」が出始める雨量をまとめる
function lineSummary(){
 const E=D.rainBins||[0.5,1,3,5,10,20,30],lab=labels(E,'mm');let rows='';
 for(const[k,name]of Object.entries(IDX.lines)){const bins=D.cond?.[k]?.rain;if(!bins)continue;
  const r=bins.map(b=>b[0]>=6?[(b[12]||0)/b[0],b[1]/b[0]]:null);
  const i=r.findIndex((x,j)=>j>0&&x&&x[0]>=.2),dry=r[0];
  const any=bins.reduce((a,b)=>a+(b[12]||0),0);
  rows+=`<tr><td>${esc(name)}</td><td>${i>0?`<b>${E[i-1]}mm以上</b>`:any?'はっきりせず':'記録なし'}</td><td>${i>0?Math.round(r[i][0]*100)+'%':'-'}</td><td>${dry?Math.round(dry[1]*100)+'%':'-'}</td></tr>`}
 return `<h2>路線別：雨で遅れ始める雨量</h2><div class="card"><div class="scroll"><table><tr><th>路線</th><th>雨が原因の遅延が<br>2割を超える雨量</th><th>その雨量での<br>発生率</th><th>雨なしの<br>遅延発生率</th></tr>${rows}</table></div>
  <p class="sub">「雨が原因」はJR西日本の運行情報で原因に「雨」を含む遅延です。雨量は路線沿いのアメダスの1時間雨量の最大値。記録がたまるほど正確になります。</p></div>`}
function render(){
 if(!D)return;
 $('out').innerHTML=lineSummary()+timelineHtml()+table('rain',D.rainBins||[0.5,1,3,5,10,20,30],'mm','雨量と遅延・混雑')+table('wind',D.windBins||[3,5,8,10,13,15,20],'m/s','風速と遅延・混雑')+delayTable();
}
['line','lv','day','tg'].forEach(id=>$(id).onchange=render);$('period').onchange=loadPeriod;
init();
</script></body></html>
